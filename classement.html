@media (max-aspect-ratio:1/1){#main{flex-direction:column}#qr{flex-direction:row}#qr img{width:20vh;height:20vh}}
.r{flex:1;display:flex;align-items:center;gap:3vw;padding:0 3vw;border-radius:16px;background:rgba(255,255,255,.1);font-weight:800;font-size:clamp(18px,4.2vh,44px);max-height:9vh}
.r:nth-child(1){background:var(--red)}
.r b{width:2.2em}.r span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{margin:auto;font-size:clamp(20px,4vh,40px);opacity:.8;text-align:center}

<script>
const API='https://script.google.com/macros/s/COLLE_TON_URL/exec';
const medal=['🥇','🥈','🥉'];
async function load(){
 const L=document.getElementById('list');
 try{
  const d=await(await fetch(API)).json();
  if(!d.top||!d.top.length){L.innerHTML='<div class="empty">Sois le premier au classement ! 🏆</div>';return}
  L.textContent='';
  d.top.forEach((x,i)=>{
   const r=document.createElement('div');r.className='r';
   [['b',medal[i]||(i+1)],['span',x.n],['b',x.s]].forEach(([t,v])=>{const e=document.createElement(t);e.textContent=v;r.appendChild(e)});
   L.appendChild(r);
  });
 }catch(e){}
}
load();setInterval(load,10000);
</script></body></html>
